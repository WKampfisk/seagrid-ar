name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.3
          cache: true

      - name: Report tool versions
        run: flutter --version

      - name: Install workspace tooling
        run: dart pub get

      - name: Bootstrap packages
        run: dart run melos bootstrap

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed apps packages

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test

