name: seagrid_ar

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  analyze:
    description: Analyze all Dart and Flutter packages.
    run: melos exec --fail-fast -- flutter analyze

  test:
    description: Run all Dart and Flutter tests.
    run: melos exec --fail-fast -- flutter test

  check:
    description: Format, analyze, and test the workspace.
    run: >-
      dart format --output=none --set-exit-if-changed . &&
      melos run analyze &&
      melos run test

